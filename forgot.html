<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | A.T.P Campus Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb; 
            --accent-blue: #60a5fa;  
            --bg-light: #f8fafc;    
            --text-dark: #1e293b;
            --white: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(96, 165, 250, 0.1) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .logo {
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -1px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--primary-blue);
        }

        h2 {
            color: var(--text-dark);
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p.subtitle {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 14px;
            color: var(--text-dark);
            font-size: 16px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            background: var(--white);
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #msg {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-animate {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">A.T.P <span>Campus Hub</span></div>
    <h2>Recover Access</h2>
    <p class="subtitle">Enter your registered email ID to generate a temporary password for your account.</p>

    <form onsubmit="resetPass(event)">
        <div class="input-group">
            <label for="email">Work/Student Email</label>
            <input type="email" id="email" placeholder="name@college.edu" required>
        </div>
        
        <button type="submit" id="submitBtn">Generate Temporary Password</button>
        <p id="msg"></p>
    </form>

    <a href="login.html" class="back-link">Back to Sign In</a>
</div>

<script>
    window.resetPass = async e => {
        e.preventDefault();
        
        const emailInput = document.getElementById('email').value;
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');

        // Loading State
        btn.innerText = "Processing...";
        btn.disabled = true;
        msg.innerText = "";
        msg.classList.remove('message-animate');

        try {
            const response = await fetch('http://127.0.0.1:5002/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailInput })
            });

            const data = await response.json();

            if (response.ok) {
                // Success popup showing the temporary password
                alert("✔ Password Reset Successful!\n\nYour new temporary password is:\n" + data.temp_password + "\n\nPlease copy this down. Click OK to return to the login screen.");
                
                // Redirect immediately after user clicks OK
                window.location.replace("login.html");
                
            } else {
                // Display error (e.g., Email not found)
                btn.disabled = false;
                btn.innerText = "Generate Temporary Password";
                msg.innerText = data.error || "Something went wrong.";
                msg.style.color = "#dc2626"; // Red
                msg.classList.add('message-animate');
            }
            
        } catch (err) {
            // Network/Server Error Handling
            console.error(err);
            btn.disabled = false;
            btn.innerText = "Generate Temporary Password";
            msg.innerText = "Cannot connect to server. Is Python running on port 5002?";
            msg.style.color = "#dc2626"; // Red
            msg.classList.add('message-animate');
        }
    };
</script>

</body>
</html>
