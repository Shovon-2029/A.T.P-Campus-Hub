<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP Campus Hub</title>
    <style>
        :root {
            --primary: #0066FF;
            --primary-dark: #004ad9;
            --bg: #f5f7f8;
            --text: #1a2736;
            --text-secondary: #64748b;
            --border: #E2E8F0;
            --shadow-xl: 0 20px 40px rgba(0, 102, 255, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        .logo {
            font-size: 1.8rem; font-weight: 800; text-decoration: none; 
            display: flex; align-items: center; gap: 8px; color: rgb(249, 1, 1);
        }

        /* --- Split Layout --- */
        .auth-container { display: flex; min-height: 100vh; }
        
        .auth-left {
            flex: 1; background: linear-gradient(135deg, #0066FF 0%, #0044aa 100%);
            color: white; padding: 60px; display: flex; flex-direction: column;
            justify-content: space-between; position: relative; overflow: hidden;
        }

        .auth-right {
            flex: 1.2; display: flex; align-items: center; justify-content: center;
            padding: 40px; background: var(--bg);
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .login-card {
            background: white; padding: 48px; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); width: 100%; max-width: 460px;
            border: 1px solid var(--border);
        }

        /* --- UI Components --- */
        .auth-toggle {
            display: flex; background: #f1f5f9; padding: 6px; border-radius: 14px;
            margin-bottom: 32px; position: relative;
        }
        
        .toggle-btn {
            flex: 1; text-align: center; padding: 10px; font-weight: 700;
            font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; z-index: 1;
            transition: color 0.3s ease;
        }
        .toggle-btn.active { color: #fff; }
        
        .toggle-slider {
            position: absolute; inset: 6px; width: calc(50% - 6px); background: var(--primary);
            border-radius: 10px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group { margin-bottom: 20px; }
        
        .input-label {
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 8px; display: block;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; transition: var(--transition);
        }

        .form-input {
            width: 100%; padding: 14px 14px 14px 45px; border-radius: 12px;
            border: 1px solid var(--border); background: #f8fafc;
            font-size: 1rem; color: var(--text); transition: var(--transition); outline: none;
        }

        .form-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1); }
        .form-input:focus + i { color: var(--primary); }

        .btn-primary {
            background: var(--primary); color: white; padding: 16px;
            border-radius: 12px; font-weight: 700; font-size: 1rem; text-decoration: none;
            display: flex; justify-content: center; align-items: center; gap: 10px; 
            transition: var(--transition); width: 100%; cursor: pointer; border: none;
            margin-top: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); background: var(--primary-dark); box-shadow: var(--shadow-xl); }

        .btn-google {
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 12px;
            padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            background: #fff; font-weight: 600; color: var(--text); transition: var(--transition);
            cursor: pointer;
        }
        .btn-google:hover { background: #f8fafc; border-color: #cbd5e1; }

        /* --- Abstract Background Shapes --- */
        .shape {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1);
            animation: float 8s ease-in-out infinite;
        }
        .shape-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .shape-2 { width: 400px; height: 400px; bottom: -150px; right: -100px; animation-delay: -4s; }

        @keyframes float { 
            0%, 100% { transform: translateY(0) scale(1); } 
            50% { transform: translateY(-20px) scale(1.05); } 
        }

        /* --- Entrance Animation --- */
        .fade-in-up {
            opacity: 0; transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            .auth-left { display: none; }
            .login-card { padding: 40px 24px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Left Branding Panel -->
        <div class="auth-left">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            
            <div class="relative z-10 fade-in-up" style="animation-delay: 0.1s;">
                <a href="index.html" class="logo text-white" style="color: white !important;">
                    <i class="fas fa-shield-halved text-blue-200"></i>
                    A.T.P <span class="text-blue-200">Campus Hub</span>
                </a>
            </div>

            <div class="relative z-10 fade-in-up" style="animation-delay: 0.3s;">
                <h1 class="text-4xl md:text-5xl font-extrabold mb-6 leading-tight">
                    Secure.<br>Anonymous.<br>Empowering.
                </h1>
                <p class="text-blue-100 text-lg max-w-md leading-relaxed">
                    Welcome back to the portal. Log in to manage reports, track grievance resolutions, and help build a safer campus environment for everyone.
                </p>
            </div>

            <div class="relative z-10 text-blue-200 text-sm fade-in-up" style="animation-delay: 0.5s;">
                © 2026 Algorithm Avengers. Protecting the Campus Voice.
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" placeholder="Type here...">
            <button>➤</button>
        </div>
    </div>

    <!-- UI Toggle Script -->
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function toggleChat() {
            const chat = document.getElementById('chatBox');
            chat.style.display = (chat.style.display === 'flex') ? 'none' : 'flex';
        }
    </script>

</body>
</html>
